name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integracion]

jobs:
  pytest:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Correr pruebas
        run: uv run python -m pytest tests -q
